<!doctype html>
<html>
  <head>
    <title>Signup</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2>Register</h2>

    <form>
      <label>Name</label><br />
      <input type="text" /><br /><br />

      <button type="submit">Create</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>

    <img src="image1.jpg" alt="Signup Image" />
  </body>
</html>
